<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>Nexus Ops Board</title>
<style>
:root{--bg:#F6F4EF;--surface:#fff;--ink:#22301F;--muted:#6E7D6E;--accent:#B8522A;--df:#1F3D2E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid #E2DFD4;border-radius:14px;box-shadow:0 4px 18px rgba(34,48,31,.06);max-width:440px;padding:34px 30px;text-align:center}
.band{background:var(--df);color:#FAFAF8;margin:-34px -30px 22px;padding:22px;border-radius:14px 14px 0 0}

p{color:var(--muted);line-height:1.55;font-size:15px}
.lock{font-size:34px}
</style></head><body>
<div class="card">
<div class="band"><div class="lock">🔒</div><h1>Nexus Ops Board</h1></div>

<p style="font-size:12.5px;color:#9aa89a;margin-top:22px">Nexus Benefit Solutions · internal</p>
</div>
</body></html>
